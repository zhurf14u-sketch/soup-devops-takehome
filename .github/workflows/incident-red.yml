name: incident reproduction (intentionally red)

on:
  workflow_dispatch:
  push:
    paths: ["evidence/incident-red-trigger.md"]

permissions: {contents: read}

jobs:
  reproduce:
    name: expected red - ${{ matrix.bug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bug: py310-import
            os: ubuntu-latest
            python: "3.10"
          - bug: windows-startup
            os: windows-latest
            python: "3.12"
          - bug: missing-wheel-data
            os: ubuntu-latest
            python: "3.12"
          - bug: tag-version
            os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run a known-bad release check - expected to fail
        working-directory: reproductions/naive
        shell: bash
        run: python ../../tools/reproduce_incident.py ${{ matrix.bug }}
