name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint and test source
        env:
          PYTHONPATH: src
        run: |
          python tools/lint.py
          python -m unittest discover -s tests -v

  artifact:
    name: build and prove wheel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Validate tag equals package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
      - name: Build, audit, and clean-install artifact
        run: |
          python tools/build.py
          python tools/audit_wheel.py dist
          python tools/smoke_install.py dist
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  container:
    name: docker smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run as non-root
        shell: bash
        run: |
          docker build --pull --tag soup-release-demo:${{ github.sha }} .
          test "$(docker run --rm --entrypoint id soup-release-demo:${{ github.sha }} -u)" = "10001"
          docker run --rm soup-release-demo:${{ github.sha }} --json

  verify-publishable-artifact:
    name: verify downloaded release artifact
    needs: [artifact, container]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository_owner == 'zhurf14u-sketch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
      - name: Verify downloaded artifact before publication
        run: |
          python tools/audit_wheel.py dist
          python tools/smoke_install.py dist

  publish-testpypi:
    name: publish to TestPyPI with OIDC
    needs: verify-publishable-artifact
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository_owner == 'zhurf14u-sketch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
