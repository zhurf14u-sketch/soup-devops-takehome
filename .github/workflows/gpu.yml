name: GPU acceptance and nightly

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *" # nightly UTC; deliberately off the hour
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    # Self-hosted runner labels must be provided by the chosen rental provider.
    runs-on: [self-hosted, linux, x64, gpu, ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove runner is the requested GPU shape
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          python -m unittest discover -s tests -v
      - name: Run bounded GPU smoke test
        env:
          GPU_TEST_MAX_SECONDS: "600"
        run: python tools/gpu_smoke.py
