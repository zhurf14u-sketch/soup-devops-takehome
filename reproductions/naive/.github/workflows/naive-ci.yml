# This copy makes the flawed historical layout self-contained. GitHub discovers only
# the root workflow at ../../../../.github/workflows/naive-ci.yml.
name: historical naive CI - not discovered by GitHub

on: [push]

jobs:
  green-but-wrong:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: python -m compileall -q src
# It never imports the package, runs Windows, builds a wheel, installs it, or checks a tag.
